[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-alpha"
version = "0.1.0"
description = "Market-informed FPL projection and optimization engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pytz",  # DuckDB needs it to read TIMESTAMPTZ cols (captured_at, kickoff_time) into Python
    "numpy>=1.24",
    "pandas>=2.0.0",
    "pulp<4.0.0",
    # Stdlib-only through step 4 (ingestion, no-vig, team-xG all pure Python).
    # Add deps as later stages need them:
    #   rapidfuzz    -> faster/better identity name matching (stdlib difflib for now)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
