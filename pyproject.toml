[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-alpha"
version = "0.1.0"
description = "Market-informed FPL projection and optimization engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Stdlib-only for ingestion (steps 1–2). Add deps as stages need them:
    #   numpy/scipy  -> team_xg + simulation (steps 4, 9)
    #   pandas       -> projections (step 11)
    #   pulp/ortools -> optimization (step 12)
    #   rapidfuzz    -> identity name matching
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
