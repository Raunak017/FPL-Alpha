[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-alpha"
version = "0.1.0"
description = "Market-informed FPL projection and optimization engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Stdlib-only through step 4 (ingestion, no-vig, team-xG all pure Python).
    # Add deps as later stages need them:
    #   numpy/scipy  -> Monte Carlo simulation + Dixon–Coles xG upgrade (steps 4, 9)
    #   pandas       -> projections (step 11)
    #   pulp/ortools -> optimization (step 12)
    #   rapidfuzz    -> faster/better identity name matching (stdlib difflib for now)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
